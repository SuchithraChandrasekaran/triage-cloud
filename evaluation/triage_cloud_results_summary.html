<div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 12px; color: var(--text-secondary);">
<span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #2a78d6;"></span>Passed first try</span>
<span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #eb6834;"></span>Passed after fix</span>
</div>
<div style="position: relative; width: 100%; height: 260px;">
<canvas id="resultsChart" role="img" aria-label="Bar chart: cost-overrun prevention 2 of 2 first try, failure-prevention 3 of 5 first try plus 2 after fix, architecture-fit 5 of 5 first try. All categories reach 100% final.">Cost-overrun prevention: 2/2 first try. Failure-prevention: 3/5 first try, 2/5 after fix. Architecture-fit: 5/5 first try.</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
new Chart(document.getElementById('resultsChart'), {
  type: 'bar',
  data: {
    labels: ['Cost-overrun\nprevention', 'Failure-\nprevention', 'Architecture-\nfit'],
    datasets: [
      { label: 'Passed first try', data: [2, 3, 5], backgroundColor: '#2a78d6', borderRadius: 4, maxBarThickness: 40 },
      { label: 'Passed after fix', data: [0, 2, 0], backgroundColor: '#eb6834', borderRadius: 4, maxBarThickness: 40 }
    ]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { stacked: true, grid: { display: false } },
      y: { stacked: true, beginAtZero: true, max: 6, ticks: { stepSize: 1 }, grid: { color: '#e1e0d9' } }
    }
  }
});
</script>
